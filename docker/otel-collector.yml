receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
  attributes/redact:
    actions:
      - { key: http.url, action: delete }
      - { key: http.uri, action: delete }
      - { key: url.full, action: delete }
      - { key: url.query, action: delete }
      - { key: http.target, action: delete }
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.x_api_key, action: delete }
      - { key: http.request.header.x_gateway_identity, action: delete }
  batch:
    timeout: 5s
    send_batch_size: 512
exporters:
  debug:
    verbosity: detailed
service:
  pipelines:
    traces:
      receivers: [ otlp ]
      processors: [ memory_limiter,attributes/redact,batch ]
      exporters: [ debug ]
