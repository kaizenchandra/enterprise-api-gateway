server:
  port: 8081
  shutdown: graceful
spring:
  application.name: gateway-control-plane
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gateway}
    username: ${DATABASE_USER:gateway}
    password: ${DATABASE_PASSWORD}
    hikari.maximum-pool-size: 10
  data.redis.host: ${REDIS_HOST:localhost}
  data.redis.timeout: 5s
  mvc.problemdetails.enabled: true
control.token: ${CONTROL_TOKEN}
upstream.allowed: ${UPSTREAM_ALLOWED:http://localhost:8091,http://localhost:8092,http://localhost:8093}
security:
  issuer: ${OIDC_ISSUER:http://localhost:8180/realms/gateway}
  jwks: ${OIDC_JWKS:http://localhost:8180/realms/gateway/protocol/openid-connect/certs}
management:
  server.port: 9081
  endpoints.web.exposure.include: health,prometheus
  endpoint.health.probes.enabled: true
logging.structured.format.console: ecs

# Prometheus metrics and local structured logs; only traces use OTLP.
management.otlp.metrics.export.enabled: false
management.logging.export.enabled: false
